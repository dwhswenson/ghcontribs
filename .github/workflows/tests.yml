name: "tests"

on:
  pull_request:
    branches:
      - main
      - stable

  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    - cron: "45 6 * * *"

defaults:
  run:
    shell: bash -l {0}

jobs:
  visualization:
    runs-on: ubuntu-latest
    name: "Visualization"
    defaults:
      run:
        working-directory: ghcontribs-viz
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ghcontribs-viz/package-lock.json
      - name: "Install"
        run: npm ci
      - name: "Vitest"
        run: npm test
      - name: "Build"
        run: npm run build

  test_suite:
    runs-on: ubuntu-latest
    name: "Test suite"
    strategy:
      matrix:
        CONDA_PY:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v2
      - uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: ${{ matrix.CONDA_PY }}
      - name: "Install"
        run: |
          python -m pip install -e ".[test]"
      - name: "Versions"
        run: conda list
      #- name: DEBUG (enable SSH login)
        #uses: mxschmitt/action-tmate@v3
      - name: "Tests"
        env:
          PY_COLORS: "1"
          GHCONTRIBS_USER: ${{ secrets.GHCONTRIBS_USER }}
          GHCONTRIBS_TOKEN: ${{ secrets.GHCONTRIBS_TOKEN }}
        run: |
          python -c "import ghcontribs"
          py.test -vv --cov --cov-report xml:cov.xml
      - uses: codecov/codecov-action@v2
        with:
          files: ./cov.xml

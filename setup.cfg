[metadata]
name = ghcontribs
version = 0.1.0.dev0
# version should end in .dev0 if this isn't to be released
short_description = Load and track contributions on GitHub
description = Load and track contributions on GitHub
long_description = file: README.md
long_description_content_type = text/markdown
author = David W.H. Swenson
author_email = dwhs@hyperblazer.net
license = MIT
url = "https://github.com/dwhswenson/ghcontribs"
classifiers = 
    Development Status :: 4 - Beta
    Environment :: Console
    Environment :: MacOS X
    Environment :: Win32 (MS Windows)
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Natural Language :: English
    Operating System :: MacOS :: MacOS X
    Operating System :: Microsoft :: Windows
    Operating System :: POSIX
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14

[options]
python_requires = >=3.11
install_requires =
    requests
    jsonschema[format-nongpl]
packages =
    ghcontribs
    ghcontribs._schemas.v1
package_dir =
    ghcontribs._schemas.v1 = schemas/v1

[options.package_data]
ghcontribs._schemas.v1 =
    *.json

[options.extras_require]
test = 
    pytest
    pytest-cov
    wheel
web =
    pyyaml
